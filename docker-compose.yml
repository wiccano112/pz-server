services:
  pz-server:
    image: indifferentbroccoli/projectzomboid-server-docker:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    cpuset: "12-17"
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - MAX_RAM=${MAX_RAM}
      - MEMORY_XMX_GB=${MEMORY_XMX_GB:-8}
      - MEMORY_XMS_GB=${MEMORY_XMS_GB:-8}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${GAME_PORT}:16261/udp" # Puerto del juego
      - "${DIRECT_PORT}:16262/udp" # Puerto de conexión directa
      - "${RCON_PORT}:27015/tcp" # Puerto de query de Steam / RCON
    volumes:
      - ${DATA_PATH}:/project-zomboid-config


